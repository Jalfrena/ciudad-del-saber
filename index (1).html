<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ciudad del Saber</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@600;800&display=swap">
<style>
:root{--negro:#0B090A;--gris:#161A1D;--r1:#660708;--r2:#A4161A;--r3:#BA181B;--r4:#E5383B;--neon:#FF0033;--t3:#B1A7A6;--t1:#F5F3F4;
--glow:0 0 18px rgba(255,0,51,.7),0 0 44px rgba(186,24,27,.4);--dis:'Orbitron','Montserrat',sans-serif;--bod:'Montserrat',system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--t1);font-family:var(--bod);background:radial-gradient(900px 520px at 85% -5%,rgba(164,22,26,.4),transparent 60%),var(--negro);overflow-x:hidden}
button{font-family:inherit;cursor:pointer}:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hidden{display:none!important}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cube{position:absolute;bottom:-20px;background:linear-gradient(135deg,var(--neon),var(--r1));box-shadow:0 0 10px var(--neon);animation:up linear infinite}
@keyframes up{from{opacity:.9}to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-10px)}}@keyframes fi{from{opacity:0;transform:translateY(14px)}}
@keyframes neon{50%{box-shadow:0 0 40px var(--neon),0 0 80px var(--r3)}}
section,header,main{position:relative;z-index:1}
.scr{animation:fi .45s}
#landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px;gap:18px}
h1{font-family:var(--dis);font-weight:800;margin:0;letter-spacing:.14em;line-height:1.1;font-size:clamp(2rem,8vw,4.4rem);text-shadow:0 0 30px rgba(255,0,51,.6)}
.sub{margin:0;color:#D3D3D3;font-size:clamp(1rem,3vw,1.3rem)}
.btn{font-family:var(--dis);font-weight:800;letter-spacing:.08em;color:#fff;background:linear-gradient(135deg,var(--r2),var(--r3));border:2px solid var(--r4);border-radius:14px;padding:15px 32px;font-size:clamp(.9rem,3.4vw,1.15rem);transition:.2s}
.btn:hover:not(:disabled){box-shadow:var(--glow);background:linear-gradient(135deg,var(--r3),var(--neon));transform:translateY(-2px) scale(1.03)}
.btn.s{padding:10px 18px;font-size:.82rem}.btn.g{background:rgba(11,9,10,.7)}.btn:disabled{opacity:.4;cursor:not-allowed}
/* cristal */
.gl{background:rgba(22,26,29,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(229,56,59,.55)}
.pn{border-radius:18px;padding:18px;box-shadow:0 0 30px rgba(102,7,8,.5)}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:2px solid var(--r2);box-shadow:0 4px 24px rgba(186,24,27,.3)}
.hg{display:flex;gap:6px;align-items:center}
.st{font-family:var(--dis);font-weight:600;font-size:clamp(.7rem,2.8vw,.92rem);padding:6px 11px;border-radius:999px;background:var(--negro);border:1px solid var(--r1);white-space:nowrap;color:var(--t1)}
.st.k{border-color:var(--r4);box-shadow:0 0 12px rgba(229,56,59,.45)}button.st:hover{border-color:var(--r4);box-shadow:var(--glow)}
/* mascota (accesorio anclado a la cabeza con porcentajes) */
.pet{font-size:var(--s,16px);width:4em;margin-top:1.8em;display:flex;flex-direction:column;align-items:center;position:relative;isolation:isolate;animation:bob 3s ease-in-out infinite}
.head{width:3.6em;height:2.7em;border-radius:1.1em;background:linear-gradient(var(--pc),color-mix(in srgb,var(--pc),#000 45%));display:flex;justify-content:center;align-items:center;gap:.7em;position:relative;box-shadow:inset 0 -.3em .5em rgba(0,0,0,.35)}
.head::before{content:"";position:absolute;top:-.8em;left:50%;width:.18em;height:.8em;background:#D3D3D3;transform:translateX(-50%)}
.head::after{content:"";position:absolute;top:-1.2em;left:50%;width:.55em;height:.55em;border-radius:50%;background:var(--neon);box-shadow:0 0 .7em var(--neon);transform:translateX(-50%)}
.head b{width:.75em;height:.75em;border-radius:50%;background:#fff;box-shadow:0 0 .5em #fff}
.bd{width:2.2em;height:1.5em;margin-top:.15em;border-radius:.6em;background:linear-gradient(var(--pc),color-mix(in srgb,var(--pc),#000 55%))}
.hat{position:absolute;top:-50%;left:50%;transform:translateX(-50%);font-style:normal;font-size:1.6em;line-height:1;z-index:2}
.hat.bn{animation:hb .7s}
@keyframes hb{0%{transform:translateX(-50%) translateY(-160%);opacity:0}55%{transform:translateX(-50%) translateY(14%)}75%{transform:translateX(-50%) translateY(-12%)}100%{transform:translateX(-50%)}}
.aura::after{content:"";position:absolute;inset:-1.4em -1.2em;border-radius:50%;background:radial-gradient(var(--pc),transparent 65%);opacity:.55;z-index:-1;animation:neon 2s infinite}
/* mapa isométrico */
.mp{max-width:1000px;margin:0 auto;padding:calc(84px + env(safe-area-inset-top,0px)) 12px 30px;text-align:center}
.mp h2{font-family:var(--dis);margin:0;font-size:clamp(1.1rem,4vw,1.6rem);letter-spacing:.08em}
.lead{color:var(--t3);margin:4px 0 10px;font-size:.88rem}
.wrap{--u:clamp(66px,16vw,120px);--h:calc(var(--u)*.35);position:relative;height:calc(var(--u)*6.3)}
.world{position:absolute;left:50%;top:52%;width:calc(var(--u)*4.4);height:calc(var(--u)*2.7);transform:translate(-50%,-50%) rotateX(60deg) rotateZ(-45deg);transform-style:preserve-3d}
.blk{position:absolute;left:calc(var(--c)*var(--u)*1.7);top:calc(var(--r)*var(--u)*1.7);width:var(--u);height:var(--u);transform-style:preserve-3d;cursor:pointer}
.blk>div{position:absolute}
.t{inset:0;background:linear-gradient(135deg,#F5F3F4,#B1A7A6);transform:translateZ(var(--h));border:2px solid var(--r4);box-shadow:0 0 22px rgba(255,0,51,.6)}
.w1,.w2,.w3,.w4{backface-visibility:hidden;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(229,56,59,.55) 10px 12px),linear-gradient(#1b1416,#0B090A)}
.w1{left:0;top:100%;width:100%;height:var(--h);transform-origin:top;transform:translateZ(var(--h)) rotateX(-90deg)}
.w2{left:0;top:calc(-1*var(--h));width:100%;height:var(--h);transform-origin:bottom;transform:translateZ(var(--h)) rotateX(90deg)}
.w3{left:calc(-1*var(--h));top:0;width:var(--h);height:100%;transform-origin:right;transform:translateZ(var(--h)) rotateY(-90deg);filter:brightness(.7)}
.w4{left:100%;top:0;width:var(--h);height:100%;transform-origin:left;transform:translateZ(var(--h)) rotateY(90deg);filter:brightness(.7)}
.bb{left:50%;bottom:50%;width:calc(var(--u)*1.5);margin-left:calc(var(--u)*-.75);transform-origin:50% 100%;transform:translateZ(var(--h)) rotateZ(45deg) rotateX(-60deg);text-align:center;pointer-events:none}
.bb span{display:block;font-size:calc(var(--u)*.55);filter:drop-shadow(0 0 8px var(--neon))}
.bb small{font-size:clamp(.5rem,1.8vw,.7rem);font-weight:800;text-shadow:0 0 6px #000,0 0 6px #000;line-height:1.1;display:block}
.blk:hover:not(.lk){filter:brightness(1.2) drop-shadow(0 0 10px var(--neon))}
.blk.lk{filter:grayscale(1) brightness(.55)}.blk.gl .t{animation:neon 1.6s infinite;background:linear-gradient(135deg,#fff,var(--neon))}.blk.dn .t{background:linear-gradient(135deg,#fff,#E5383B)}
.pth{position:absolute;background:var(--neon);box-shadow:0 0 14px var(--neon);transform:translateZ(2px)}
.pth.h{left:calc(var(--c)*var(--u)*1.7 + var(--u));top:calc(var(--r)*var(--u)*1.7 + var(--u)*.45);width:calc(var(--u)*.7);height:calc(var(--u)*.1)}
.pth.v{left:calc(var(--c)*var(--u)*1.7 + var(--u)*.45);top:var(--u);width:calc(var(--u)*.1);height:calc(var(--u)*.7)}
/* islas */
.pl{max-width:900px;margin:0 auto;padding:calc(84px + env(safe-area-inset-top,0px)) 14px 40px}
.back{background:none;border:0;color:var(--t3);margin-bottom:8px;font-size:.95rem}.back:hover{color:#fff}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:10px}.hd h3{font-family:var(--dis);margin:0}
.two{display:grid;gap:14px}@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.plot{min-height:200px;border:2px dashed var(--r3);border-radius:14px;background:repeating-linear-gradient(45deg,rgba(229,56,59,.12) 0 2px,transparent 2px 22px),repeating-linear-gradient(-45deg,rgba(229,56,59,.12) 0 2px,transparent 2px 22px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.lay{display:flex;flex-direction:column-reverse}.lay span{font-size:3rem;line-height:1.05;min-height:1.05em;text-shadow:0 0 14px var(--neon)}
.pop{animation:hb .6s}
.inv{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.blkd,.card{background:var(--negro);border:2px solid var(--r3);border-radius:12px;padding:10px 14px;cursor:grab;user-select:none;text-align:center;box-shadow:0 0 10px rgba(229,56,59,.4)}
.blkd span{font-size:2rem;display:block}.blkd small{font-size:.72rem}.blkd.used{opacity:.25;pointer-events:none}
.rb{animation:sh .5s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.card{font-size:.85rem;max-width:210px}
.zs{display:flex;gap:10px;flex-wrap:wrap}.zs.tl{position:relative}.zs.tl::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:var(--neon);box-shadow:var(--glow)}
.zn{flex:1;min-width:130px;min-height:90px;border:2px dashed var(--r3);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(11,9,10,.6);position:relative}
.zn b{font-family:var(--dis);font-size:.8rem;color:var(--r4)}
.phb{height:16px;border-radius:9px;background:linear-gradient(90deg,#BA181B,#F5B301,#2ECC71,#3B82F6);position:relative;margin:10px 0}
.phb i{position:absolute;top:-5px;width:6px;height:26px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff;transition:left .5s;left:28%}
.plant{font-size:4.5rem;transition:.5s;filter:drop-shadow(0 0 14px var(--neon))}
.say{margin-top:10px;padding:10px;border-radius:12px;background:var(--negro);border:1px solid var(--r2);min-height:44px;font-size:.9rem}
.opts{display:grid;gap:9px;margin:12px 0}
.opt{background:var(--negro);color:var(--t1);border:2px solid var(--r1);border-radius:12px;padding:12px;font-size:.98rem;font-weight:600;transition:.15s}
.opt:hover{border-color:var(--r4);box-shadow:0 0 14px rgba(229,56,59,.5)}.opt.bad{background:var(--r1);border-color:var(--r4);animation:sh .35s}
textarea,input[type=text]{width:100%;background:var(--negro);color:var(--t1);border:2px solid var(--r1);border-radius:12px;padding:10px;font:inherit}
.fin{text-align:center;max-width:620px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
/* escape room */
.clk{font-family:var(--dis);font-weight:800;font-size:clamp(2.4rem,12vw,4.5rem);text-align:center;color:var(--neon);text-shadow:0 0 14px var(--neon),0 0 40px var(--r3);letter-spacing:.1em;margin-bottom:16px}
.locks{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.lock{color:var(--t1);border-radius:16px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;transition:.2s}
.lock span{font-size:2.4rem}.lock:hover{box-shadow:var(--glow)}.lock.op{border-color:#fff;opacity:.6}
table{width:100%;border-collapse:collapse;margin:8px 0}th,td{padding:9px;border-bottom:1px solid var(--r1)}tr.me{background:rgba(255,0,51,.25);font-weight:800}
#ov{position:fixed;inset:0;z-index:40;background:rgba(11,9,10,.85);display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.md{width:100%;max-width:520px;border-radius:20px;padding:22px;box-shadow:var(--glow);text-align:center;margin:auto}.md h3{font-family:var(--dis);margin:6px 0}
.it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;margin-top:8px;border:1px solid var(--r1);border-radius:12px;text-align:left;background:var(--negro)}.it.on{border-color:var(--r4)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:60;max-width:90vw;background:var(--r2);border:2px solid var(--r4);border-radius:14px;padding:12px 20px;font-weight:600;text-align:center;box-shadow:var(--glow);transition:.3s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pth{background:linear-gradient(90deg,var(--r1) 0,#fff 50%,var(--r1) 100%) 0 0/200% 100%;animation:pl 1.4s linear infinite}
.pth.v{background:linear-gradient(180deg,var(--r1) 0,#fff 50%,var(--r1) 100%) 0 0/100% 200%;animation-name:plv}
@keyframes pl{to{background-position:-200% 0}}@keyframes plv{to{background-position:0 -200%}}
.emo{position:absolute;bottom:-40px;opacity:.45;animation:up linear infinite}
.top2{display:grid;gap:12px;margin-bottom:6px}@media(min-width:760px){.top2{grid-template-columns:1fr 1fr}}
.dl{display:flex;align-items:center;gap:12px;justify-content:center}.rk{font-family:var(--dis);color:var(--neon);font-weight:800;text-shadow:0 0 10px var(--neon)}
.pbar{height:12px;border-radius:8px;background:var(--negro);border:1px solid var(--r2);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--r2),var(--neon));box-shadow:var(--glow);transition:width .6s}
.cnts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:.85rem}
.tip{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}.tip p{margin:0;min-height:3em}
.seal{position:absolute;right:-4px;top:-.4em;font-style:normal;font-size:calc(var(--u)*.38);animation:bob 2s ease-in-out infinite}
.bigl{font-size:calc(var(--u)*.95)!important;filter:brightness(.35) drop-shadow(0 0 8px #000)!important}
.bud{font-family:var(--dis);padding:10px;border:1px solid var(--r3);border-radius:12px;background:var(--negro);text-align:center}.bud b{color:var(--neon)}
.rcp{border:2px dashed var(--neon);border-radius:14px;padding:14px;text-align:center;font-size:1.4rem;min-width:150px}.rcp small{display:block;font-size:.7rem;color:var(--t3)}
.plant.sick{filter:sepia(1) saturate(4) hue-rotate(-20deg) drop-shadow(0 0 10px #F5B301)}
.story{margin-top:14px;line-height:2.5;text-align:left}.story input{width:9em;display:inline-block;padding:4px 8px}.story input.ok{border-color:#2ECC71}.story input.no{border-color:var(--neon)}
.mach{position:relative;text-align:center;border-radius:14px;padding:14px;margin-bottom:12px;overflow:hidden;filter:grayscale(1);opacity:.5;transition:.8s}
.mach span:first-child{font-size:3.4rem;display:block}.mach.fixd{filter:none;opacity:1;box-shadow:var(--glow)}
.pc{position:absolute;left:50%;top:100%;font-size:2rem;animation:fly 1.2s ease-out forwards;opacity:0}
@keyframes fly{0%{transform:translate(-50%,200px) scale(2);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-90px) scale(.8);opacity:0}}
.cyl{position:relative;width:64px;height:92px;border-radius:12px/10px;background:linear-gradient(90deg,#1a1d21,#6b7076 20%,#e1e1e1 48%,#8a8f96 72%,#15181b);box-shadow:0 0 18px rgba(255,0,51,.55),0 0 40px rgba(186,24,27,.35);display:grid;place-items:center;transition:.3s;margin-top:10px}
.cyl::before{content:"";position:absolute;top:-8px;left:0;right:0;height:16px;border-radius:50%;background:linear-gradient(90deg,#444,#e8e8e8,#555);box-shadow:0 2px 6px #000}
.cyl::after{content:"";position:absolute;left:-2px;right:-2px;bottom:12px;height:7px;border-radius:4px;background:var(--neon);box-shadow:0 0 12px var(--neon),0 0 24px var(--neon)}
.cyl b{font-size:1.9rem;font-weight:400;filter:drop-shadow(0 1px 2px #000);margin-top:-14px}
.cyl.op{box-shadow:0 0 14px #fff}.cyl.op::after{background:#2ECC71;box-shadow:0 0 14px #2ECC71}

.ic{position:relative;display:inline-block;width:1em;height:1em;vertical-align:-.14em;background:linear-gradient(135deg,#FF0033,#A4161A);filter:drop-shadow(0 0 3px rgba(255,0,51,.7))}
.ic-spark{background:linear-gradient(135deg,#F5B301,#FF0033);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);width:.8em;height:.8em;vertical-align:-.05em}
.ic-key{background:none;width:1.4em;filter:none}.ic-key::before{content:"";position:absolute;left:0;top:.1em;width:.6em;height:.6em;border:.15em solid #F5F3F4;border-radius:50%;box-shadow:0 0 6px #FF0033}.ic-key::after{content:"";position:absolute;left:.55em;top:.33em;width:.8em;height:.16em;background:#F5F3F4;box-shadow:.5em .14em 0 -.02em #F5F3F4}
.ic-mate{box-sizing:border-box;border:2px solid #E5383B;background:linear-gradient(#0B090A,#0B090A) 50% 0/2px 100% no-repeat,linear-gradient(#0B090A,#0B090A) 0 50%/100% 2px no-repeat,linear-gradient(135deg,#F5F3F4,#B1A7A6)}
.ic-cien{clip-path:polygon(50% 0,100% 100%,0 100%)}
.ic-leng{background:none;filter:none;width:auto;font:800 1em/1 var(--dis);color:#fff;text-shadow:0 0 8px #FF0033}.ic-leng::before{content:"Aa"}
.ic-hist{background:repeating-linear-gradient(90deg,#F5F3F4 0 22%,#A4161A 22% 34%);clip-path:polygon(50% 0,100% 30%,100% 100%,0 100%,0 30%)}
.ic-ia,.ic-hex{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}.ic-hex{background:linear-gradient(135deg,#F5F3F4,#BA181B)}
.ic-mis{clip-path:circle(50%);background:radial-gradient(circle,#0B090A 22%,#FF0033 25% 45%,#0B090A 48% 60%,#F5F3F4 63%)}
.ic-lock{width:.8em;height:.6em;margin-top:.3em;background:linear-gradient(#D3D3D3,#6b7076)}.ic-lock::before{content:"";position:absolute;left:.12em;top:-.4em;width:.56em;height:.5em;border:.12em solid #D3D3D3;border-bottom:0;border-radius:.4em .4em 0 0}
.ic-ck{width:.45em;height:.85em;background:none;border:solid #2ECC71;border-width:0 .18em .18em 0;transform:rotate(45deg);filter:drop-shadow(0 0 4px #2ECC71);vertical-align:0}
.ic-bulb{width:.75em;height:.75em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#F5B301);box-shadow:0 0 8px #F5B301}.ic-bulb::after{content:"";position:absolute;left:25%;bottom:-.2em;width:50%;height:.18em;background:#B1A7A6;border-radius:2px}
.ic-bag{clip-path:polygon(18% 22%,82% 22%,100% 100%,0 100%);background:linear-gradient(#FF0033,#660708)}
.ic-drop{width:.7em;height:.7em;border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:linear-gradient(135deg,#7dd3fc,#3B82F6)}
.ic-comp{border-radius:30%;background:linear-gradient(#8B5A2B,#3d2410)}
.ic-acid{clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(#e8ff5a,#a3c400)}
.ic-flask{clip-path:polygon(35% 0,65% 0,65% 35%,100% 100%,0 100%,35% 35%);background:linear-gradient(#fff,#FF0033)}
.ic-fnd{width:1.9em;height:.5em;background:linear-gradient(#8a8f96,#3a3d42)}.ic-wall{width:1.7em;height:.9em;background:repeating-linear-gradient(0deg,#BA181B 0 .26em,#0B090A .26em .3em)}.ic-roof{width:2em;height:.9em;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(#FF0033,#660708)}
.ic-hglass{clip-path:polygon(0 0,100% 0,50% 50%,100% 100%,0 100%,50% 50%);background:linear-gradient(#D3D3D3,#6b7076)}
.ic-gear{box-sizing:border-box;border-radius:50%;background:radial-gradient(circle,transparent 30%,#D3D3D3 32%);border:.18em dotted #F5F3F4}
.ic-clock{box-sizing:border-box;border-radius:50%;background:#F5F3F4;border:.12em solid #FF0033}.ic-clock::before{content:"";position:absolute;left:46%;top:18%;width:8%;height:36%;background:#0B090A}.ic-clock::after{content:"";position:absolute;left:46%;top:46%;width:30%;height:8%;background:#0B090A}
.ic-aura{border-radius:50%;background:none;box-shadow:0 0 .4em .1em #FF0033,inset 0 0 .3em #FF0033;filter:none}

.hint{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(11,9,10,.6);border:1px solid color-mix(in srgb,var(--ac),transparent 50%)}.hint p{margin:0;font-size:.88rem;line-height:1.4}
.stage .laberinto{width:min(100%,540px)}
/* ilustraciones de cada isla */
.ihart{height:76px;width:auto;max-width:130px;margin:-10px 0;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
.stage{background:linear-gradient(rgba(11,9,10,.4),rgba(11,9,10,.82)),var(--art) center/cover no-repeat,var(--env)}
.ig.th-mate .crane{display:none}
.ig.th-hist .stage{background:var(--env)}
.ig .mach{min-height:300px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(transparent 55%,rgba(11,9,10,.85)),var(--art) center/contain no-repeat,radial-gradient(circle,rgba(245,179,1,.28),rgba(11,9,10,.85) 70%)}
.ig.th-hist .mach span:first-child{display:none}
.ig .mach small{background:rgba(11,9,10,.7);padding:4px 10px;border-radius:10px}
@media(max-width:560px){.ihart{height:56px}}



/* ===== v10: oportunidades y espera de respuesta ===== */
.lives{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 10px;font:700 .85rem var(--dis)}
.pip{width:16px;height:16px;border-radius:50%;background:#2b2e33;border:2px solid var(--r3)}.pip.on{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.opt:disabled{opacity:.4;cursor:not-allowed}.opt:disabled:hover{border-color:var(--r1);box-shadow:none}

/* ===== v11: modo tótem (pantalla vertical táctil, p. ej. 1080×1920) ===== */
html{-webkit-tap-highlight-color:transparent;overscroll-behavior:none;scrollbar-width:none}
::-webkit-scrollbar{display:none}
@media (orientation:portrait) and (min-width:960px) and (min-height:1000px){
:root{--k:1.62}
@media(min-width:1700px){:root{--k:3.24}}
html{font-size:2.4vw}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
/* inicio */
#landing{padding:2rem 1.5rem;gap:1.4rem}h1{font-size:10.5vw}.sub{font-size:1.1rem}
.btn{padding:.9rem 1.8rem;border-radius:1rem}.btn.s{padding:.65rem 1.2rem;font-size:.75rem}
/* cabecera */
#hud{padding:.55rem 1rem;gap:.5rem}.logo{font-size:.7rem}.lg{scale:var(--k);margin:0 .6rem}
.nv button{font-size:.78rem;padding:.55rem .6rem}.st{font-size:.78rem;padding:.4rem .75rem}
.pl,.hubg,.mp{padding:calc(4.6rem + env(safe-area-inset-top,0px)) 1.2rem 3rem;max-width:none}
.ig{max-width:none}.fin{max-width:40rem!important}
/* mapa */
.hubg{grid-template-columns:minmax(0,1fr);gap:1.2rem}
.board{aspect-ratio:1/1.05;min-height:0}.isl2{width:27%}.isl2.big{width:34%}
.lbl{font-size:.8rem;padding:.4rem .8rem;border-radius:.7rem}.lbl small{font-size:.65rem}
.side{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:center}
.side .bub{grid-column:1/-1;font-size:.9rem;padding:.8rem 1rem}.side .tip{grid-column:1/-1}
#gm{display:flex;justify-content:center}.pet{width:calc(var(--s)*7*var(--k))}
.pr span{width:2.6rem;height:2.6rem}.pbar{height:.8rem}
.items{grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr))}.item{min-height:6.5rem;font-size:.8rem}
.tabs button{min-height:3rem;font-size:.9rem}.sw.big{width:1.8rem;height:1.8rem}
/* islas: una columna, juego arriba y panel abajo */
.cols{grid-template-columns:minmax(0,1fr);gap:1.2rem}
.stage{min-height:36vh;padding:1.2rem;border-radius:1.4rem}.ig .cp{padding:1.3rem;border-radius:1.4rem}
.ihd{padding:.7rem 1rem;border-radius:1.2rem;gap:.6rem}.ihd h3{font-size:1.15rem;min-width:0}.ihi{font-size:2rem}
.ihart{height:4.2rem;max-width:7rem;margin:-.5rem 0}
.ins{font-size:.9rem;padding:.8rem 1rem}.mini,.lead{font-size:.82rem}
.blkd,.card{padding:.7rem 1rem;border-radius:.9rem}.ig .card{font-size:.85rem}.ig .blkd span{font-size:2.6rem}
.zn{min-width:8rem;min-height:5.5rem;padding:.5rem;border-radius:.9rem}
.opt{padding:.9rem;font-size:.9rem;border-radius:.9rem;min-height:3.2rem}
.say{padding:.7rem;min-height:3rem;font-size:.85rem;border-radius:.9rem}
textarea,input[type=text]{padding:.7rem;font-size:.9rem;border-radius:.9rem}
.ig .plot{min-height:9rem}.site .plot{max-width:24rem;min-height:15rem}
.dev{width:min(100%,24rem)}.phb{height:1.1rem;border-radius:.6rem}.phb i{width:.4rem;height:1.8rem;top:-.35rem}
.plant{scale:var(--k);margin:2.2rem 1.5rem}
.book{max-width:none}.ig .mach{max-width:30rem;min-height:18rem}.bot{max-width:28rem}
.laberinto,.stage .laberinto{width:min(100%,80vw)}.nd{font-size:1rem}
.pip{width:1rem;height:1rem}td,th{padding:.6rem}

#ov{padding:1.2rem}.md{max-width:36rem;padding:1.6rem;border-radius:1.4rem}.it{padding:.7rem;font-size:.9rem}
#toast{bottom:14vh;padding:.8rem 1.4rem;border-radius:1rem;font-size:.95rem;max-width:80vw}
}

  return `<button class="isl2 ${lk?'lk':''} ${dn?'dn':''} ${x.id=='mis'?(all?'gl big':'big'):''}" style="left:${(50+38*Math.cos(a)).toFixed(1)}%;top:${(50+33*Math.sin(a)).toFixed(1)}%;--d:${(Math.random()*2).toFixed(1)}s" onclick="go('${x.id}')" aria-label="${SUBJ[x.id]}"><img src="${ART[x.id]}" alt="">${lk?'<i class="ic ic-lock biglk"></i>':''}${dn?'<em class="seal"><i class="ic ic-ck"></i></em>':''}<span class="lbl"><i class="ic ic-${x.i}"></i> ${SUBJ[x.id]}${lk?'<small>Requiere 5 llaves</small>':''}</span></button>`}).join('');

 M.forEach((b,i)=>{const e=document.createElement('div');e.className='blkd';e.innerHTML=`<span>${ic(b[0])}</span><small>${b[1]} · ${b[2]}</small>`;$('#inv').append(e);dnd(e,i)});lk();

 I.forEach(x=>{const e=document.createElement('div');e.className='blkd';e.innerHTML=`<span><i class="ic ic-${x[0]}"></i></span><small>${x[1]}</small>`;$('#ing').append(e);dnd(e,x[2])});dnd($('#mx'),'mx');
 const draw=()=>{$('#mk').style.left=ph/14*97+'%';$('#pv').textContent='pH '+ph+(ph>=6&&ph<=8?' · ideal':ph<6?' · ácido':' · básico')};
 zone($('#rc'),id=>{if(!(id in D))return;ph=Math.max(0,Math.min(14,ph+D[id]));draw()});
 zone($('#hp'),id=>{if(id!='mx')return;const pp=$('#pp');
  if(ph>=6&&ph<=8){st++;pp.className='plant s'+st;$('#mg').textContent='¡Funciona! La planta crece.';sfx.ok();ph=4;draw();if(st==2)setTimeout(()=>win('cien'),900)}
  else{sfx.bad();pp.className='plant s'+st+' sick';$('#mg').textContent=ph<6?'El suelo está muy ácido, usa compost.':'El suelo está muy básico, añade un poco de ácido.'}});draw()}
/* C, D, E) Ordenar o encajar bloques */
function ord(c){const n=c.C.length;let put={},el=[];
const Z=c.L.map((z,i)=>`<div class="zn" id="z${i}"><b>${z}</b></div>`).join(''),K='<div class="inv" id="cd"></div>',R=c.run?'<button class="btn" id="run" disabled>Ejecutar prompt</button><div class="say" id="say">Esperando instrucciones…</div>':'',
 V=CUR=='ia'?[`<div class="bot">${pet(20)}${R}</div>`,`<div class="zs col">${Z}</div>${K}`]:CUR=='hist'?[`${c.pre||''}<div class="zs tl">${Z}</div>`,K]:[`<div class="book"><div class="zs bk">${Z}</div></div>`,K];
 isl(c.t,c.d,V[0],V[1]);
 const reset=()=>{put={};el.forEach(e=>$('#cd').append(e));if(c.run)$('#run').disabled=true},
 test=()=>{const w=c.C.findIndex((_,z)=>put[z]!=z);if(w<0)return c.ok();const m=c.M?c.M[w]:'La historia no está en orden, inténtalo otra vez';sfx.bad();say(m);toast(m);setTimeout(reset,1000)};
 c.order.forEach(i=>{const e=document.createElement('div');e.className='card';e.textContent=c.C[i];dnd(e,i);el[i]=e;$('#cd').append(e)});
 c.L.forEach((_,z)=>zone($('#z'+z),id=>{if(put[z]!==undefined||Object.values(put).includes(id))return;put[z]=id;$('#z'+z).append(el[id]);if(Object.keys(put).length==n){c.run?$('#run').disabled=false:test()}}));
 if(c.run)$('#run').onclick=()=>{$('#run').disabled=true;say('Chispa-Bot pensando…');setTimeout(test,1400)}}
function leng(){const ck=()=>{let all=1;$$('.story input').forEach(i=>{const ok=i.value.trim().toLowerCase()==i.dataset.a;i.className=ok?'ok':'no';if(!ok)all=0});
  say(all?'El corrector no encontró errores.':'El corrector encontró errores: revisa la ortografía y las tildes.');all?(sfx.ok(),setTimeout(()=>win('leng'),900)):sfx.bad()};
 ord({t:'Plaza de las Palabras',d:'Ordena las tarjetas en Inicio, Nudo y Final. Luego completa el cuento.',L:['Inicio','Nudo','Final'],C:['Un dragón vivía en una biblioteca antigua.','Un día, el mapa del tesoro desapareció.','Juntos lo encontraron y se hicieron amigos.'],order:[1,2,0],
 ok:()=>{sfx.ok();$('.pn').insertAdjacentHTML('beforeend','<div class="story">Había un <input type="text" data-a="dragón" placeholder="d…"> que vivía en una <input type="text" data-a="biblioteca" placeholder="b…"> antigua. Un día, el mapa del tesoro <input type="text" data-a="desapareció" placeholder="d…">. Juntos lo <input type="text" data-a="encontraron" placeholder="e…"> y se hicieron amigos.</div><button class="btn s" id="ck">Revisar con el corrector</button><div class="say" id="say">Escribe cada palabra con su ortografía correcta.</div>');$('#ck').onclick=ck}})}
function hist(){ord({t:'Museo del Tiempo',d:'Arrastra los hechos a la línea del tiempo, del más antiguo al más reciente.',cls:'tl',pre:'<div class="mach gl" id="mc"><span><i class="ic ic-hglass"></i></span><small id="ms">Máquina del tiempo rota: faltan 3 piezas</small></div>',L:['1.º','2.º','3.º'],C:['Se inventa la imprenta de Gutenberg','Colón llega a América','Centroamérica se independiza de España'],order:[2,0,1],
 ok:()=>{sfx.ok();['hex','gear','clock'].forEach((q,i)=>{const e=document.createElement('span');e.className='pc';e.innerHTML=`<i class="ic ic-${q}"></i>`;e.style.animationDelay=i*.5+'s';$('#mc').append(e)});setTimeout(()=>{$('#mc').classList.add('fixd');$('#ms').textContent='¡Máquina reparada!';$('#mc span').innerHTML='<i class="ic ic-clock"></i>'},1700);setTimeout(()=>win('hist'),2700)}})}
function ia(){ord({t:'Laboratorio de Chispa-Bot',d:'Encaja los bloques en Rol, Tarea, Contexto y Formato. Luego ejecuta el prompt.',run:1,L:['Rol','Tarea','Contexto','Formato'],C:['Actúa como profesora de ciencias','Explica qué es la fotosíntesis','Para niños de 10 años','Responde en 3 pasos con emojis'],order:[2,3,0,1],
 M:['No entiendo. Te falta definir mi Rol','La tarea no está clara','Te falta contexto','Falta el formato de respuesta'],ok:()=>{say('¡Instrucción clara! Chispa-Bot: Paso 1: la planta capta luz. Paso 2: absorbe agua y CO₂. Paso 3: produce azúcar y oxígeno.');setTimeout(()=>win('ia'),1000)}})}
/* ===== Isla del Misterio: Laberinto ===== */
const E=[['Mate','A','¿Cuánto es 9 × 7?',['56','63','72'],1,'Descompón: 9 × 7 es 10 × 7 menos 7.'],['Ciencias','B','¿Qué gas necesitamos respirar para vivir?',['Oxígeno','Helio','Dióxido de carbono'],0,'Las plantas lo liberan al hacer fotosíntesis.'],['Lenguaje','C','¿Cuál es un sinónimo de “feliz”?',['Triste','Enojado','Contento'],2,'Piensa en cómo te sientes con una buena noticia.'],['Historia','D','¿Qué civilización construyó las pirámides de Giza?',['Los egipcios','Los romanos','Los mayas'],0,'Vivían junto al río Nilo, en África.'],['IA','E','¿Qué lleva un buen prompt?',['Solo una palabra','Rol, tarea y contexto','Puras mayúsculas'],1,'Dile a la IA quién debe ser, qué hacer y para qué.']];
const W=[[0,20,70,3],[30,40,70,3],[0,60,70,3],[30,80,70,3],[45,0,3,9],[20,31,3,9],[65,43,3,9]],NP=[[82,10],[50,31],[60,51],[40,71],[80,91]];
let T,left,opened,team,busy=0,quickMode=false,lives=3,dead=0,noclose=0;
function intro(){clearInterval(T);busy=0;if(!quickMode&&S.keys<5){toast('Necesitas 5 llaves para entrar');return hub()}scr(`${BG('mis')}<div class="pl"><button class="back" onclick="hub()">← Volver al mapa</button><div class="fin gl pn"><h2 style="font-family:var(--dis)">Isla del Misterio</h2><p>Guía a la mascota por el laberinto, abre los 5 nodos y escapa en 5:00. Tienes 3 oportunidades: si fallas 3 veces, pierdes. ${quickMode?'<b>Modo demo:</b> no gasta llaves.':'Al comenzar se gastan tus 5 llaves; para volver a entrar deberás conseguirlas otra vez.'}</p><label><input type="checkbox" id="tm"> Modo Equipo</label><input type="text" id="tn" maxlength="16" placeholder="Nombre del equipo"><button class="btn" onclick="startEsc()">COMENZAR</button><button class="btn s g" onclick="rankScr()">Mejores tiempos</button></div></div>`)}
function over(msg){clearInterval(T);dead=1;busy=1;noclose=1;modal(`<h3>Game Over</h3><p>${msg}</p>${quickMode?'':'<p class="lead">Se gastaron tus 5 llaves: consíguelas de nuevo para volver a entrar a la Isla del Misterio.</p>'}<button class="btn s" onclick="closeM();${quickMode?'intro()':'hub()'}">${quickMode?'Reintentar':'Volver al mapa'}</button>`)}
const lv=()=>'Oportunidades '+[0,1,2].map(k=>`<i class="pip ${k<lives?'on':''}"></i>`).join('');
function again(){if(quickMode)return intro();toast('Consigue de nuevo las 5 llaves para volver a entrar');hub()}
function startEsc(){team=$('#tm').checked?($('#tn').value.trim()||'Equipo 1'):'';if(!quickMode){S.keys=0;S.done={};save();hud()}opened=[];left=300;lives=3;dead=0;busy=0;noclose=0;mazeUI();clearInterval(T);T=setInterval(()=>{left--;const c=$('#clk');if(c)c.textContent=fmt(left);if(left<=0)over('El Científico Loco escapó…')},1000)}
function mazeUI(){scr(`${BG('mis')}<div class="pl ig th-mis" style="--art:url('${ART.mis||''}')">${ish('Isla del Misterio','mis')}<div class="cols"><section class="stage"><div class="laberinto" id="lb">${W.map(w=>`<i class="wl" style="left:${w[0]}%;top:${w[1]}%;width:${w[2]}%;height:${w[3]}%"></i>`).join('')}${NP.map((q,i)=>`<div class="nd" id="n${i}" style="left:${q[0]}%;top:${q[1]}%">${E[i][1]}</div>`).join('')}<div class="jg" id="jg" style="--pc:${S.eq.color}"><b></b><b></b></div></div></section><aside class="gl pn cp"><div class="clk" id="clk">${fmt(left)}</div><div class="lives" id="lv">${lv()}</div><p class="ins"><i class="ic ic-mis"></i> Objetivo: activa los 5 nodos antes de que se acabe el tiempo. Toca o arrastra para mover a tu mascota.</p><p class="lead" id="cnt" style="text-align:center">Nodos: 0/5 · ${E.map(e=>e[1]+' '+e[0]).join(' · ')}</p><div class="hint">${pet(11)}<p>Chispa-Bot: al tocar un nodo verás su pregunta. Si te atascas, pídeme una pista con un prompt claro: rol, tarea y contexto.</p></div></aside></div></div>`);maze()}
function maze(){const B=$('#lb'),P=$('#jg'),cool=[0,0,0,0,0];let px=3,py=7,dn=0;
 const hit=(x,y)=>W.some(w=>x<w[0]+w[2]&&x+6>w[0]&&y<w[1]+w[3]&&y+6>w[1]);
 const touch=()=>{if(busy||dead||left<=0)return;NP.forEach((q,i)=>{if(opened.includes(i)||Date.now()<cool[i])return;if(Math.hypot(px+3-q[0],py+3-q[1])<6){dn=0;ask(i)}})};
 const mv=(tx,ty)=>{for(let k=0;k<80;k++){const dx=tx-px,dy=ty-py,d=Math.hypot(dx,dy);if(d<.2)break;const f=Math.min(.8,d)/d,nx=px+dx*f,ny=py+dy*f;if(!hit(nx,ny)){px=nx;py=ny}else if(!hit(nx,py))px=nx;else if(!hit(px,ny))py=ny;else break}P.style.left=px+'%';P.style.top=py+'%';touch()};
 const mm=e=>{const r=B.getBoundingClientRect();mv(Math.max(0,Math.min(94,(e.clientX-r.left)/r.width*100-3)),Math.max(0,Math.min(94,(e.clientY-r.top)/r.height*100-3)))};
 B.onpointerdown=e=>{if(busy||dead)return;dn=1;try{B.setPointerCapture(e.pointerId)}catch(x){}sfx.clk();mm(e)};B.onpointermove=e=>{if(dn)mm(e)};B.onpointerup=B.onpointercancel=()=>{dn=0};
 P.style.left=px+'%';P.style.top=py+'%';
 const ask=i=>{cool[i]=Date.now()+2000;busy=1;const e=E[i];
  modal(`<h3>Nodo ${e[1]} · ${e[0]}</h3><p>${e[2]}</p><p class="lead" id="wt">Lee la pregunta… podrás responder en 3 s</p><div class="opts">${e[3].map((v,k)=>`<button class="opt" data-k="${k}" disabled>${v}</button>`).join('')}</div><textarea id="pt" rows="2" placeholder="Pide una pista: Actúa como profesor y dame una pista…"></textarea><button class="btn s g" id="hb" style="margin-top:8px">Pedir pista a Chispa-Bot</button><div class="say" id="say"></div>`);
  let w=3;noclose=1;const wi=setInterval(()=>{w--;const t=$('#wt');if(!t){clearInterval(wi);return}if(w<=0){clearInterval(wi);noclose=0;t.textContent='Elige tu respuesta';$$('#md .opt').forEach(b=>b.disabled=false)}else t.textContent='Lee la pregunta… podrás responder en '+w+' s'},1000);
  $$('#md .opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;const n=$('#n'+i);if(+b.dataset.k===e[4]){sfx.ok();opened.push(i);n.classList.add('ok');closeM();$('#cnt').textContent='Nodos: '+opened.length+'/5';if(opened.length==5)endEsc()}
   else{sfx.bad();closeM();cool[i]=Date.now()+2000;n.classList.add('bad');setTimeout(()=>n.classList.remove('bad'),2000);lives--;const l=$('#lv');if(l)l.innerHTML=lv();if(lives<=0)return over('Te quedaste sin oportunidades.');toast('Incorrecto. Te quedan '+lives+(lives==1?' oportunidad':' oportunidades')+'. Espera 2 segundos para reintentar')}});
  $('#hb').onclick=()=>{const t=norm($('#pt').value);say(t.split(/\s+/).filter(Boolean).length>=5&&/pista|ayuda|profesor|profesora|tutor|explica/.test(t)?'Pista: '+e[5]:'Tu prompt no es claro, intenta estructurarlo mejor')}}}
function endEsc(){clearInterval(T);const id=Date.now();S.rank.push({n:team||S.pet||'Jugador',t:300-left,id});S.rank.sort((a,b)=>a.t-b.t);S.rank=S.rank.slice(0,10);S.sparks+=50;save();hud();rankScr(id)}
function rankScr(cur){const r=S.rank.find(x=>x.id===cur);scr(`<div class="pl"><div class="fin gl pn" style="max-width:700px">${cur?`<h2 style="font-family:var(--dis)">¡Felicidades, has completado Ciudad del Saber!</h2><p>Tiempo: <b>${fmt(r?r.t:0)}</b> · +50 Chispas</p>`:'<h2 style="font-family:var(--dis)">Mejores tiempos</h2>'}
 <table><tr><th>#</th><th>Jugador</th><th>Tiempo</th></tr>${S.rank.map((x,i)=>`<tr class="${x.id===cur?'me':''}"><td>${i+1}</td><td>${x.n}</td><td>${fmt(x.t)}</td></tr>`).join('')||'<tr><td colspan=3>Aún no hay tiempos</td></tr>'}</table>
 <div class="hg" style="flex-wrap:wrap;justify-content:center"><button class="btn s" onclick="again()">Jugar de nuevo</button><button class="btn s g" onclick="shop()">Ver mi mascota</button><button class="btn s g" onclick="hub()">Mapa</button></div></div></div>`)}
/* ===== Tienda ===== */
const SH=[{id:'h1',t:'hat',v:'htop',n:'Sombrero de copa',p:20},{id:'h4',t:'hat',v:'hcp',n:'Gorra',p:30},{id:'h3',t:'hat',v:'hwz',n:'Gorro de mago',p:40},{id:'h2',t:'hat',v:'hcr',n:'Corona',p:60},{id:'c0',t:'color',v:'#BA181B',n:'Rojo original',p:0},{id:'c1',t:'color',v:'#19C3E6',n:'Cian',p:25},{id:'c2',t:'color',v:'#8E5BFF',n:'Violeta',p:25},{id:'c3',t:'color',v:'#F5B301',n:'Dorado',p:25},{id:'au',t:'aura',v:'glow',n:'Aura brillante',p:30},{id:'au2',t:'aura',v:'ring',n:'Aura anillo',p:40}];
function shopHTML(){const T3=[['hat','Sombreros'],['color','Colores'],['aura','Auras']];
 return `<div class="sph"><b><i class="ic ic-bag"></i> Tienda</b><span class="prev">${pet(8)}</span><button class="spx" onclick="tg()" aria-label="Cerrar">×</button></div><div class="tabs">${T3.map(t=>`<button class="${STAB==t[0]?'on':''}" onclick="STAB='${t[0]}';shopRender()">${t[1]}</button>`).join('')}</div><div class="items">${SH.filter(i=>i.t==STAB).map(i=>{const own=i.p==0||S.owned.includes(i.id),on=i.t=='hat'?S.eq.hat==i.v:i.t=='aura'?S.eq.aura==i.v:S.eq.color==i.v,pv=i.t=='color'?`<b class="sw big" style="background:${i.v}"></b>`:i.t=='aura'?`<i class="ic ic-aura" style="width:1.6em;height:1.6em"></i>`:`<i class="ic ${i.v}" style="width:2em;height:1.5em"></i>`;
  return `<button class="item ${on?'on':''}" onclick="buy('${i.id}')">${pv}<span>${i.n}</span><small>${own?(on?(i.t=='color'?'En uso':'Quitar'):'Equipar'):'<i class="ic ic-spark"></i> '+i.p}</small></button>`}).join('')}</div>`}
function shopRender(){const sp=$('#sp');if(sp)sp.innerHTML=shopHTML();const g=$('#gm');if(g)g.innerHTML=pet(24)}
function shop(){openShop()}
function buy(id){const i=SH.find(v=>v.id==id),own=i.p==0||S.owned.includes(id);
 if(!own){if(S.sparks<i.p){sfx.bad();return toast('Te faltan '+(i.p-S.sparks)+' chispas')}S.sparks-=i.p;S.owned.push(id)}
 if(i.t=='hat'){S.eq.hat=S.eq.hat==i.v?'':i.v;S.bn=!!S.eq.hat}else if(i.t=='aura')S.eq.aura=S.eq.aura==i.v?'':i.v;else S.eq.color=i.v;
 sfx.ok();save();hud();shopRender();S.bn=0}
/* ===== Inicio ===== */
function enter(){$('#landing').classList.add('hidden');$('#hud').classList.remove('hidden');$('#bnav').classList.remove('hidden');$('#app').classList.remove('hidden');hud();hub()}
$('#start').onclick=()=>{if(S.pet)return enter();
 modal(`<div style="display:flex;justify-content:center">${pet(20)}</div><h3>¡Tu mascota despertó!</h3><p class="lead">¿Cómo se va a llamar?</p><input type="text" id="nm" maxlength="14" placeholder="Escribe un nombre"><button class="btn s" style="margin-top:12px" id="go1">Comenzar</button>`);
 $('#go1').onclick=()=>{S.pet=($('#nm').value.trim()||'Chispa').slice(0,14);save();closeM();enter()};setTimeout(()=>$('#nm').focus(),50)};
$('#quick').onclick=()=>{if(!S.pet){S.pet='Chispa';save()}quickMode=true;enter();intro()};
$('#rst').onclick=()=>{if(confirm('¿Borrar todo el progreso, incluida la mascota?')){try{localStorage.removeItem(KEY)}catch(e){}load();clearInterval(T);$('#hud').classList.add('hidden');$('#bnav').classList.add('hidden');$('#app').classList.add('hidden');$('#landing').classList.remove('hidden')}};
$('#ov').onclick=e=>{if(e.target.id=='ov'&&S.pet&&!noclose)closeM()};
load();$('#himg').src=ART.land;$('#lpet').innerHTML=pet(30);
</script>
